<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>LE COURS — LE DIVAN</title>
<meta name="description" content="Plan de cours : ce que la recherche en psychologie établit vraiment, et ce qu'elle a démoli.">
<meta name="theme-color" content="#E9EAE6">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Archivo:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root{
  --stone:#E9EAE6; --stone2:#F2F3F0; --panel:#FDFDFC;
  --ink:#15181C; --ink-soft:#4A5056; --faint:#7D848B;
  --rule:#D2D5CF; --rule-soft:#E2E4DF;
  --bleu:#2A3F8F; --bleu-soft:#E4E7F3; --bleu-line:#A9B4DC;
  --rose:#8E5450; --rose-soft:#F3E7E5;
  --vert:#3C6A52; --vert-soft:#E3EDE6;
  --or:#7E6220; --or-soft:#F4EBD8;
  --on-fg:#FDFDFC;
  --disp:"Newsreader",Georgia,"Times New Roman",serif;
  --ui:"Archivo",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --stone:#14181B; --stone2:#1A1F23; --panel:#1E2429;
    --ink:#E8EAE5; --ink-soft:#AFB6BA; --faint:#7E868C;
    --rule:#2C3338; --rule-soft:#232A2E;
    --bleu:#97AAEA; --bleu-soft:#1B2340; --bleu-line:#3C4A7C;
    --rose:#DC9E98; --rose-soft:#352421;
    --vert:#7CC19A; --vert-soft:#16291F;
    --or:#D7AE63; --or-soft:#2C2416;
    --on-fg:#14181B;
  }
}
:root[data-theme="dark"]{
  --stone:#14181B; --stone2:#1A1F23; --panel:#1E2429;
  --ink:#E8EAE5; --ink-soft:#AFB6BA; --faint:#7E868C;
  --rule:#2C3338; --rule-soft:#232A2E;
  --bleu:#97AAEA; --bleu-soft:#1B2340; --bleu-line:#3C4A7C;
  --rose:#DC9E98; --rose-soft:#352421;
  --vert:#7CC19A; --vert-soft:#16291F;
  --or:#D7AE63; --or-soft:#2C2416;
  --on-fg:#14181B;
}

*{box-sizing:border-box}
body{margin:0;background:var(--stone);color:var(--ink);font-family:var(--ui);font-size:16px;line-height:1.55;-webkit-text-size-adjust:100%}
h1,h2,h3,h4{font-family:var(--disp);font-weight:500;text-wrap:balance;margin:0}
a{color:var(--bleu)}
button{font-family:var(--ui);font-size:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--bleu);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.wrap{max-width:780px;margin:0 auto;padding:30px 28px 110px}
@media (max-width:620px){.wrap{padding:20px 18px 90px}}

.top{display:flex;justify-content:space-between;align-items:baseline;gap:16px;flex-wrap:wrap;border-bottom:1px solid var(--rule);padding-bottom:12px}
.brand{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);text-decoration:none}
.brand b{color:var(--ink);font-weight:500}
.brand:hover b{color:var(--bleu)}

.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--bleu);margin:34px 0 10px}
h1{font-size:clamp(32px,6vw,50px);line-height:1.06;letter-spacing:-.015em}
.lede{font-family:var(--disp);font-style:italic;font-size:20px;line-height:1.5;color:var(--ink-soft);margin-top:16px;max-width:34rem}
.body p{font-size:16.5px;line-height:1.65;color:var(--ink-soft);max-width:34rem}

/* verdicts */
.pill{display:inline-block;font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;padding:3px 7px;border-radius:2px;white-space:nowrap;vertical-align:1px}
.p-etabli{background:var(--vert-soft);color:var(--vert);border:1px solid var(--vert)}
.p-conteste{background:var(--or-soft);color:var(--or);border:1px solid var(--or)}
.p-effondre{background:var(--rose-soft);color:var(--rose);border:1px solid var(--rose)}
.p-marketing{background:transparent;color:var(--faint);border:1px dashed var(--faint)}

.legend{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:1px;background:var(--rule);border:1px solid var(--rule);border-radius:4px;overflow:hidden;margin-top:28px}
.leg{background:var(--panel);padding:13px 15px;display:flex;flex-direction:column;gap:5px}
.leg span{font-size:13.5px;color:var(--ink-soft);line-height:1.45}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:1px;background:var(--rule);border:1px solid var(--rule);border-radius:4px;overflow:hidden;margin-top:14px}
.stat{background:var(--panel);padding:12px 14px}
.stat .k{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}
.stat .v{font-family:var(--disp);font-size:27px;line-height:1.15;margin-top:1px;font-variant-numeric:tabular-nums}

/* blocs & modules */
.bloc{margin-top:54px}
.blochead{display:flex;gap:14px;align-items:baseline;border-top:2px solid var(--ink);padding-top:12px}
.blocn{font-family:var(--mono);font-size:12px;color:var(--bleu);letter-spacing:.1em}
.bloct{font-size:25px;line-height:1.15}
.blocl{font-family:var(--disp);font-style:italic;color:var(--ink-soft);font-size:17px;line-height:1.5;margin-top:8px;max-width:33rem}

.mod{border-top:1px solid var(--rule-soft);padding:26px 0 4px;display:grid;grid-template-columns:40px minmax(0,1fr);gap:0 14px}
.mod:first-of-type{border-top:1px solid var(--rule);margin-top:20px}
.modn{font-family:var(--disp);font-size:27px;line-height:1;color:var(--bleu);font-variant-numeric:tabular-nums}
.modt{font-size:21px;line-height:1.25}
.modq{font-family:var(--disp);font-style:italic;font-size:16.5px;line-height:1.5;color:var(--ink-soft);margin-top:6px}

.lecons{list-style:none;margin:16px 0 0;padding:0;display:flex;flex-direction:column;gap:9px}
.lecon{display:grid;grid-template-columns:34px minmax(0,1fr);gap:0 10px;align-items:baseline}
.lecon .ln{font-family:var(--mono);font-size:10.5px;color:var(--faint);padding-top:3px}
.lecon .lt{font-size:15.5px;line-height:1.4}
.lecon .ld{font-size:14px;color:var(--ink-soft);line-height:1.5;margin-top:2px}

.banc{margin:18px 0 6px;border-left:2px solid var(--bleu-line);padding:2px 0 2px 14px;display:flex;flex-direction:column;gap:9px}
.banct{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}
.idee{font-size:14.5px;line-height:1.5}
.idee q{font-style:italic;quotes:"\201C" "\201D"}
.idee .pill{margin-right:7px}

.divan{font-family:var(--mono);font-size:11px;color:var(--faint);margin:14px 0 2px;line-height:1.6}
.divan b{color:var(--bleu);font-weight:500}

@media (max-width:620px){
  .mod{grid-template-columns:minmax(0,1fr)}
  .modn{font-size:20px;margin-bottom:4px}
  .lecon{grid-template-columns:minmax(0,1fr)}
  .lecon .ln{padding:0 0 1px}
}

.plate{background:var(--panel);border:1px solid var(--rule);border-radius:4px;padding:22px 24px;margin-top:46px}
.plate h3{font-size:20px;margin-bottom:10px}
.plate p{margin:0 0 11px;font-size:15.5px;color:var(--ink-soft);line-height:1.62}
.plate p:last-child{margin-bottom:0}
.plate code{font-family:var(--mono);font-size:13px;background:var(--stone2);padding:1px 5px;border-radius:2px;color:var(--ink)}
.warn{border-left:3px solid var(--rose);background:var(--rose-soft);border-radius:0 3px 3px 0;padding:14px 16px;margin-top:22px;font-size:14.5px;line-height:1.6}
.warn b{color:var(--rose)}
/* ——— examens ——— */
.revbox{display:flex;align-items:center;gap:14px;flex-wrap:wrap;border:1px solid var(--bleu-line);background:var(--bleu-soft);border-radius:4px;padding:14px 17px;margin-top:16px}
.revbox .rt{font-family:var(--disp);font-size:17px;line-height:1.3;flex:1 1 230px}
.revbox .rn{font-family:var(--mono);font-size:11px;color:var(--bleu)}
.modexam{margin-top:14px}
.modexam button{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;background:none;border:1px solid var(--rule);color:var(--ink-soft);border-radius:3px;padding:5px 9px}
.modexam button:hover{border-color:var(--bleu);color:var(--bleu)}
.exprog{height:3px;background:var(--rule-soft);border-radius:2px;overflow:hidden;margin-top:16px}
.exprog i{display:block;height:100%;background:var(--bleu)}
.exmeta{font-family:var(--mono);font-size:11px;color:var(--faint);margin-top:10px;display:flex;gap:16px;flex-wrap:wrap}
.exq{font-family:var(--disp);font-size:21px;line-height:1.45;margin:26px 0 0;max-width:34rem}
.exzone{margin-top:20px;display:flex;flex-direction:column;gap:12px;max-width:34rem}
.exzone textarea{width:100%;min-height:110px;padding:12px 14px;border:1px solid var(--rule);border-radius:3px;background:var(--panel);color:var(--ink);font-family:var(--ui);font-size:15.5px;line-height:1.6;resize:vertical}
.exopt{display:flex;flex-direction:column;gap:8px}
.exopt button{text-align:left;background:var(--panel);border:1px solid var(--rule);border-radius:3px;padding:12px 15px;font-size:15.5px;line-height:1.45;color:var(--ink)}
.exopt button:hover:not(:disabled){border-color:var(--bleu);background:var(--bleu-soft)}
.exopt button:disabled{cursor:default;opacity:.75}
.exopt button.bon{border-color:var(--vert);background:var(--vert-soft);opacity:1}
.exopt button.faux{border-color:var(--rose);background:var(--rose-soft);opacity:1}
.exverd{display:flex;gap:8px;flex-wrap:wrap}
.exverd button{background:none;border:1px solid var(--rule);border-radius:3px;padding:9px 13px;font-family:var(--mono);font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-soft)}
.exverd button:hover:not(:disabled){border-color:var(--bleu);color:var(--bleu)}
.exverd button:disabled{cursor:default}
.exverd button.bon{border-color:var(--vert);background:var(--vert-soft);color:var(--vert)}
.exverd button.faux{border-color:var(--rose);background:var(--rose-soft);color:var(--rose)}
.exrep{border-left:3px solid var(--bleu);background:var(--stone2);border-radius:0 3px 3px 0;padding:14px 16px}
.exrepk{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--bleu);margin-bottom:6px}
.exrep p{margin:0;font-size:16px;line-height:1.62}
.exauto{display:flex;gap:9px;flex-wrap:wrap;align-items:center}
.exauto .lab{font-family:var(--mono);font-size:10.5px;color:var(--faint);margin-right:4px}
.exbilan{border:1px solid var(--rule);border-radius:4px;background:var(--panel);padding:20px 22px;margin-top:24px}
.exbilan .score{font-family:var(--disp);font-size:34px;line-height:1.1}
.exbilan p{margin:8px 0 0;font-size:15.5px;color:var(--ink-soft);line-height:1.6}
.exvide{font-family:var(--disp);font-style:italic;font-size:18px;color:var(--ink-soft);margin-top:20px;line-height:1.5}

/* ——— leçon ——— */
.lec-nav{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:38px;padding-top:18px;border-top:1px solid var(--rule)}
.btn{border:1px solid var(--ink);background:var(--ink);color:var(--stone);border-radius:3px;padding:10px 17px;font-weight:500;font-size:14.5px;text-decoration:none;display:inline-block}
.btn:hover{background:var(--bleu);border-color:var(--bleu);color:var(--on-fg)}
.btn.ghost{background:none;color:var(--ink);border-color:var(--rule)}
.btn.ghost:hover{background:var(--stone2);color:var(--ink);border-color:var(--ink)}
.lec-meta{font-family:var(--mono);font-size:11px;color:var(--faint);margin-top:14px;display:flex;gap:16px;flex-wrap:wrap}
.lec{margin-top:30px;display:flex;flex-direction:column;gap:19px;max-width:35rem}
.lh{font-size:21px;line-height:1.25;margin-top:12px}
.lp{font-size:17px;line-height:1.68;color:var(--ink);margin:0}
.ex{border-left:3px solid var(--bleu);background:var(--bleu-soft);border-radius:0 3px 3px 0;padding:15px 17px}
.exk{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--bleu);margin-bottom:6px}
.ex p{margin:0;font-family:var(--disp);font-size:17.5px;line-height:1.55}
.def{border:1px solid var(--rule);border-radius:3px;padding:13px 16px;background:var(--panel)}
.defm{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--or);margin-bottom:5px}
.def p{margin:0;font-size:15.5px;line-height:1.6;color:var(--ink-soft)}
.calc{font-family:var(--mono);font-size:12.5px;line-height:1.85;background:var(--stone2);border:1px solid var(--rule-soft);border-radius:3px;padding:14px 16px;overflow-x:auto;margin:0;white-space:pre;color:var(--ink)}
ol.lnum,ul.lli{margin:0;padding-left:1.3em;display:flex;flex-direction:column;gap:11px}
ol.lnum li,ul.lli li{font-size:16.5px;line-height:1.62}
ol.lnum li::marker{font-family:var(--mono);font-size:13px;color:var(--bleu)}
.tabwrap{overflow-x:auto;border:1px solid var(--rule);border-radius:3px}
table{border-collapse:collapse;width:100%;font-size:14.5px;background:var(--panel)}
th{text-align:left;font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);font-weight:400;padding:10px 13px;border-bottom:1px solid var(--rule)}
td{padding:10px 13px;border-bottom:1px solid var(--rule-soft);line-height:1.45;vertical-align:top}
tr:last-child td{border-bottom:0}
td:last-child{font-variant-numeric:tabular-nums}
.lverdict{display:flex;gap:11px;align-items:flex-start;border:1px solid var(--rule);border-radius:3px;padding:13px 15px;background:var(--panel)}
.lverdict .vx{font-size:15.5px;line-height:1.55}
.lverdict .vx b{font-weight:500}
.lkey{border-left:3px solid var(--vert);background:var(--vert-soft);border-radius:0 3px 3px 0;padding:15px 17px}
.lkeyk{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--vert);margin-bottom:6px}
.lkey p{margin:0;font-size:16.5px;line-height:1.6}
.fig{overflow-x:auto;border:1px solid var(--rule-soft);border-radius:3px;background:var(--panel);padding:12px}
.fig svg{display:block;width:100%;height:auto;min-width:420px}
.recap{display:flex;flex-direction:column;gap:26px;margin:4px 0}
.recapgrp{border-top:1px solid var(--rule);padding-top:14px}
.recaph{display:flex;align-items:baseline;gap:10px;margin-bottom:12px}
.recaph .recapn{font-family:var(--mono);font-size:11px;color:var(--faint)}
.recapl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.recapl li{display:grid;grid-template-columns:40px minmax(0,1fr);gap:0 10px;align-items:baseline;font-size:14.5px;line-height:1.5}
.recapl .src{font-family:var(--mono);font-size:10.5px;color:var(--faint);padding-top:2px}
.recapl b{font-weight:500}
.recapl span.why{color:var(--ink-soft)}
@media (max-width:560px){.recapl li{grid-template-columns:minmax(0,1fr)}.recapl .src{padding:0 0 1px}}
.lecon.ouvrable{cursor:pointer}
.lecon a{text-decoration:none;color:inherit}
.lecon a:hover .lt{color:var(--bleu);text-decoration:underline;text-underline-offset:3px}
.lire{display:inline-block;font-family:var(--mono);font-size:8.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--on-fg);background:var(--bleu);border-radius:2px;padding:2px 5px;margin-left:7px;vertical-align:2px}
.foot{margin-top:40px;padding-top:16px;border-top:1px solid var(--rule);font-family:var(--mono);font-size:11px;color:var(--faint);line-height:1.8}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <a class="brand" href="./"><b>LE DIVAN</b> · retour aux entretiens</a>
    <span class="brand">Plan de cours · v1</span>
  </div>
  <div id="app"></div>
</div>

<script src="cours-a.js?v=1"></script>
<script src="cours-b.js?v=1"></script>
<script src="cours-b2.js?v=1"></script>
<script src="cours-c.js?v=1"></script>
<script src="cours-c2.js?v=1"></script>
<script src="cours-d.js?v=1"></script>
<script src="cours-e.js?v=1"></script>
<script src="cours-f.js?v=1"></script>
<script src="examens.js?v=1"></script>
<script>
"use strict";

/* ═══════════════════════════════════════════════════════════════
   LE COURS — plan. Chaque leçon s'écrira une par une.
   Verdicts : etabli · conteste · effondre · marketing
   ═══════════════════════════════════════════════════════════════ */

const PLAN = [
{
  bloc:"A", titre:"L'outillage",
  lede:"Un seul module, et c'est le plus rentable de tout le cours. Sans lui, tout le reste se lit comme une collection d'anecdotes dont on ne peut rien faire.",
  modules:[
  {
    n:1, titre:"Lire une étude sans être dupe",
    q:"Pourquoi « une étude a montré que… » n'est pas un argument, et par quoi le remplacer.",
    divan:"Ce module conditionne tous les autres : c'est lui qui te permettra de contredire ce cours.",
    lecons:[
      {n:"1.1", t:"Corrélation, causalité, et le troisième larron",
       d:"Les gens qui courent sont plus heureux. Trois lectures possibles de cette phrase, dont deux n'ont rien à voir avec la course. La randomisation, et pourquoi on ne peut pas toujours la faire."},
      {n:"1.2", t:"La taille d'effet, la seule question qui compte",
       d:"« Significatif » veut dire « probablement pas dû au hasard », pas « important ». Le d de Cohen, le r, l'odds ratio, lus en langage ordinaire : combien de gens ça change, et de combien."},
      {n:"1.3", t:"Comment une étude fausse naît sans la moindre fraude",
       d:"p-hacking, tiroir des résultats nuls, hypothèse écrite après coup. Trois mécanismes honnêtes qui produisent de la littérature fausse à grande échelle."},
      {n:"1.4", t:"La crise de la réplication",
       d:"2011-2015 : on refait cent expériences classiques, environ un tiers à 40 % tiennent. Ce que ça a vraiment cassé, et les réponses (préenregistrement, réplications multi-laboratoires, échantillons dix fois plus grands)."},
      {n:"1.5", t:"Méta-analyses : le meilleur et le pire outil",
       d:"Agréger cinquante études ne les rend pas vraies. Biais de publication, hétérogénéité, et l'entonnoir qui permet de le voir à l'œil nu."},
      {n:"1.6", t:"WEIRD : sur qui la psychologie a-t-elle été faite ?",
       d:"L'écrasante majorité des sujets vient de pays occidentaux, éduqués, industrialisés, riches, démocratiques — et souvent du cours d'intro de psycho. Ce que ça invalide, et ce que ça n'invalide pas."},
      {n:"1.7", t:"Cinq questions pour trier une affirmation en deux minutes",
       d:"La grille qu'on réutilisera dans tout le reste du cours, appliquée en direct à trois affirmations prises sur les réseaux."}
    ],
    idees:[
      {s:"effondre", t:"« C'est prouvé scientifiquement »", d:"une étude seule ne prouve rien ; la réplication indépendante est l'unité de preuve."},
      {s:"conteste", t:"« Les sciences humaines, ce n'est pas vraiment de la science »", d:"vrai pour une partie de la production des années 1990-2010, faux pour la méthodologie actuelle."}
    ]
  }]
},
{
  bloc:"B", titre:"Qui tu es",
  lede:"La psychologie des différences individuelles : ce qui te distingue durablement des autres. C'est le domaine le plus solide de la discipline, et c'est aussi celui que le commerce a le plus pillé.",
  modules:[
  {
    n:2, titre:"La personnalité",
    q:"Combien y a-t-il de façons d'être quelqu'un, et est-ce que ça bouge ?",
    divan:"Éclaire la section 4 de l'entretien 1 (Tempérament).",
    lecons:[
      {n:"2.1", t:"Les cinq grands facteurs, et d'où ils sortent",
       d:"L'hypothèse lexicale : si une différence humaine compte, la langue a fini par lui donner un mot. On factorise le dictionnaire, il reste cinq paquets. Pourquoi c'est moins arbitraire que ça en a l'air."},
      {n:"2.2", t:"Ce que ces cinq facteurs prédisent réellement",

// **gras** rendu par noeuds de texte : aucune interpolation HTML
function rich(node, texte){
  String(texte).split(/(\*\*[^*]+\*\*)/g).forEach(part => {
    if(!part) return;
    if(part.startsWith("**") && part.endsWith("**")) node.appendChild(el("b", null, part.slice(2, -2)));
    else node.appendChild(document.createTextNode(part));
  });
  return node;
}

/* ─────────── examens : stockage, planification, passation ─────────── */
const EXK = "divan_exam_v1";
const BOITES = [1, 3, 7, 16, 35, 90];       // jours avant la prochaine présentation
let EXETAT = {v:1, q:{}};
let EXCORROMPU = false, EXMUET = false;

const qkey = x => x.l + "|" + x.t + "|" + x.q.slice(0, 40);
const aujourdhui = () => new Date().toISOString().slice(0, 10);
const dansNJours = n => new Date(Date.now() + n * 86400000).toISOString().slice(0, 10);

function examLoad(){
  let brut;
  try{ brut = localStorage.getItem(EXK); }
  catch(e){ EXMUET = true; return; }            // stockage inaccessible : on joue sans mémoire
  if(brut === null) return;                     // vide : cas normal d'un premier passage
  try{
    const o = JSON.parse(brut);
    if(!o || typeof o !== "object" || typeof o.q !== "object") throw new Error("forme");
    EXETAT = {v:1, q:o.q};
  }catch(e){ EXCORROMPU = true; }               // illisible ≠ vide : on refuse d'écrire par-dessus
}
function examSave(){
  if(EXCORROMPU || EXMUET) return;
  try{ localStorage.setItem(EXK, JSON.stringify(EXETAT)); }
  catch(e){ EXMUET = true; }                    // quota atteint : on continue sans enregistrer
}

const fiche = x => EXETAT.q[qkey(x)];
function noter(x, reussi){
  const k = qkey(x);
  const f = EXETAT.q[k] || {n:0, ok:0, box:0, due:null};
  f.n++;
  if(reussi){ f.ok++; f.box = Math.min(f.box + 1, BOITES.length - 1); }
  else { f.box = 0; }
  f.due = dansNJours(BOITES[f.box]);
  EXETAT.q[k] = f; examSave();
}

const modulesEcrits = () => PLAN.flatMap(b => b.modules).filter(m => m.lecons.some(l => CONTENU[l.n])).map(m => String(m.n));
const qDuModule = n => EXAMENS.filter(x => x.m === String(n));
function qDues(){
  const h = aujourdhui();
  return EXAMENS.filter(x => { const f = fiche(x); return f && f.due && f.due <= h; });
}
function qNeuves(){
  const ok = modulesEcrits();
  return EXAMENS.filter(x => !fiche(x) && ok.indexOf(x.m) >= 0);
}
function melange(a){ const t = a.slice(); for(let i = t.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [t[i], t[j]] = [t[j], t[i]]; } return t; }

function serie(mode){
  if(mode === "revision") return melange(qDues()).slice(0, 20);
  if(mode === "session"){
    const dues = melange(qDues()).slice(0, 5);
    const neuves = melange(qNeuves()).slice(0, 8 - dues.length);
    return melange(dues.concat(neuves));
  }
  return melange(qDuModule(mode));            // mode = numéro de module
}

    ["etabli", "conteste", "effondre", "marketing"].forEach(cat => {
      const b = el("button", null, LABEL[cat]);
      b.onclick = () => {
        const bon = cat === x.s;
        [...row.children].forEach(c => { c.disabled = true; });
        b.className = bon ? "bon" : "faux";
        if(!bon) [...row.children].forEach(c => { if(c.textContent === LABEL[x.s]) c.className = "bon"; });
        reveler(bon);
      };
      row.appendChild(b);
    });
    zone.appendChild(row);
  }
  else {
    const row = el("div", "exopt");
    x.o.forEach((opt, i) => {
      const b = el("button", null, opt);
      b.onclick = () => {
        const bon = i === x.c;
        [...row.children].forEach((c, j) => { c.disabled = true; if(j === x.c) c.className = "bon"; });
        if(!bon) b.className = "faux";
        reveler(bon);
      };
      row.appendChild(b);
    });
    zone.appendChild(row);
  }

  app.appendChild(navExamen());
  window.scrollTo({top:0, behavior:"instant"});
}

function renderBilan(){
  const app = document.getElementById("app");
  app.textContent = "";
  app.appendChild(el("div", "eyebrow", "Examen terminé"));
  app.appendChild(el("h1", null, titreExamen()));
  const b = el("div", "exbilan");
  b.appendChild(el("div", "score", EXBON + " / " + EXLISTE.length));
  const rates = EXLISTE.length - EXBON;
  b.appendChild(el("p", null, rates === 0
    ? "Tout est su. Ces questions reviendront plus tard, de plus en plus espacées — c'est le principe de la leçon 7.5."
    : rates + (rates > 1 ? " questions reviendront" : " question reviendra") + " dès demain, les autres plus tard. L'écart entre ce qu'on croit savoir et ce qu'on sait restituer est exactement ce que cet exercice mesure."));
  app.appendChild(b);
  app.appendChild(navExamen(true));
  window.scrollTo({top:0, behavior:"instant"});
}

function navExamen(fin){
  const nav = el("div", "lec-nav");
  if(fin){
    const dues = qDues().length;
    if(dues){
      const a = document.createElement("a"); a.className = "btn"; a.href = "#examen-revision";
      a.textContent = "Réviser (" + dues + ")"; nav.appendChild(a);
    }
  }
  const back = document.createElement("a"); back.className = "btn ghost"; back.href = "#plan"; back.textContent = "Le plan";
  nav.appendChild(back);
  return nav;
}

/* ─────────── table des verdicts, assemblée depuis le cours ─────────── */
function buildRecap(){
  const lignes = [];
  const vus = new Set();
  const norm = t => t.toLowerCase().replace(/[^a-zà-ÿ0-9]/g, "").slice(0, 40);

  // 1. les verdicts rendus dans les leçons écrites : ils portent leur numéro
  LECONS.forEach(({l}) => {
    const blocs = CONTENU[l.n]; if(!blocs) return;
    blocs.forEach(b => {
      if(b.t !== "verdict") return;
      const k = norm(b.x); if(vus.has(k)) return; vus.add(k);
      lignes.push({s: b.s, titre: b.x, why: b.d, src: l.n});
    });
  });

  // 2. les idées annoncées au plan dont le module n'est pas encore écrit
  PLAN.forEach(bl => bl.modules.forEach(m => {
    const ecrit = m.lecons.some(l => CONTENU[l.n]);
    if(ecrit) return;
    (m.idees || []).forEach(i => {
      const k = norm(i.t); if(vus.has(k)) return; vus.add(k);
      lignes.push({s: i.s, titre: i.t.replace(/^«\s*|\s*»$/g, ""), why: i.d, src: "mod. " + m.n});
    });
  }));

  const wrap = el("div", "recap");
  ["etabli", "conteste", "effondre", "marketing"].forEach(cat => {
    const groupe = lignes.filter(x => x.s === cat);
    if(!groupe.length) return;
    const g = el("div", "recapgrp");
    const h = el("h3", "recaph");
    h.appendChild(el("span", "pill p-" + cat, LABEL[cat]));
    h.appendChild(el("span", "recapn", groupe.length + (groupe.length > 1 ? " entrées" : " entrée")));
    g.appendChild(h);
    const ul = el("ul", "recapl");
    groupe.forEach(x => {
      const li = el("li");
      li.appendChild(el("span", "src", x.src));
      const d = el("div");
      d.appendChild(el("b", null, x.titre));
      d.appendChild(el("span", "why", " — " + x.why));
      li.appendChild(d); ul.appendChild(li);
    });
    g.appendChild(ul); wrap.appendChild(g);
  });
  return wrap;
}

/* ─────────── vue leçon ─────────── */
function renderLecon(num){
  const idx = LECONS.findIndex(x => x.l.n === num);
  const {l, m, b} = LECONS[idx];
  const blocs = CONTENU[num];
  const app = document.getElementById("app");
  app.textContent = "";

  app.appendChild(el("div", "eyebrow", "Bloc " + b.bloc + " · Module " + m.n + " · Leçon " + l.n));
  app.appendChild(el("h1", null, l.t));
  const meta = el("div", "lec-meta");
  meta.appendChild(el("span", null, m.titre.toUpperCase()));
  meta.appendChild(el("span", null, Math.max(1, Math.round(mots(blocs) / 200)) + " min de lecture"));
  app.appendChild(meta);

  const box = el("div", "lec");
  blocs.forEach(bl => {
    if(bl.t === "h") box.appendChild(el("h2", "lh", bl.x));
    else if(bl.t === "p") box.appendChild(rich(el("p", "lp"), bl.x));
    else if(bl.t === "ex"){
      const d = el("div", "ex");
      d.appendChild(el("div", "exk", bl.titre || "Exemple"));
      d.appendChild(rich(el("p"), bl.x)); box.appendChild(d);
    }
    else if(bl.t === "def"){
      const d = el("div", "def");
      d.appendChild(el("div", "defm", bl.mot));
      d.appendChild(rich(el("p"), bl.x)); box.appendChild(d);
    }
    else if(bl.t === "calc") box.appendChild(el("pre", "calc", bl.lignes.join("\n")));
    else if(bl.t === "num" || bl.t === "li"){
      const list = el(bl.t === "num" ? "ol" : "ul", bl.t === "num" ? "lnum" : "lli");
      bl.items.forEach(i => list.appendChild(rich(el("li"), i)));
      box.appendChild(list);
    }
    else if(bl.t === "tab"){
      const w = el("div", "tabwrap"); const tb = el("table");
      const tr = el("tr"); bl.head.forEach(h => tr.appendChild(el("th", null, h)));
      const th = document.createElement("thead"); th.appendChild(tr); tb.appendChild(th);
      const tbody = document.createElement("tbody");
      bl.rows.forEach(r => { const row = el("tr"); r.forEach(c => row.appendChild(el("td", null, c))); tbody.appendChild(row); });
      tb.appendChild(tbody); w.appendChild(tb); box.appendChild(w);
    }
    else if(bl.t === "verdict"){
      const d = el("div", "lverdict");
      d.appendChild(el("span", "pill p-" + bl.s, LABEL[bl.s]));
      const x = el("div", "vx");
      const strong = el("b", null, "« " + bl.x + " » ");
      x.appendChild(strong); x.appendChild(el("span", null, "— " + bl.d));
      d.appendChild(x); box.appendChild(d);
    }
    else if(bl.t === "key"){
      const d = el("div", "lkey");
      d.appendChild(el("div", "lkeyk", "Ce qu'il faut retenir"));
      d.appendChild(rich(el("p"), bl.x)); box.appendChild(d);
    }
    else if(bl.t === "svg"){
      const d = el("div", "fig"); d.innerHTML = bl.src; box.appendChild(d);
    }
    else if(bl.t === "recap") box.appendChild(buildRecap());
  });
  app.appendChild(box);

  const nav = el("div", "lec-nav");
  const pos = ECRITES.findIndex(x => x.l.n === num);
  if(pos > 0){ const a = document.createElement("a"); a.className = "btn ghost"; a.href = "#" + ECRITES[pos-1].l.n; a.textContent = "← " + ECRITES[pos-1].l.n; nav.appendChild(a); }
  if(pos < ECRITES.length - 1){ const a = document.createElement("a"); a.className = "btn"; a.href = "#" + ECRITES[pos+1].l.n; a.textContent = "Leçon " + ECRITES[pos+1].l.n + " · " + ECRITES[pos+1].l.t + " →"; nav.appendChild(a); }
  if(qDuModule(m.n).length){
    const ex = document.createElement("a"); ex.className = "btn ghost";
    ex.href = "#examen-" + m.n; ex.textContent = "Examen du module " + m.n;
    nav.appendChild(ex);
  }
  const back = document.createElement("a"); back.className = "btn ghost"; back.href = "#plan"; back.textContent = "Le plan";
  nav.appendChild(back);
  app.appendChild(nav);
  window.scrollTo({top:0, behavior:"instant"});
}

function route(){
  const h = decodeURIComponent(location.hash.replace(/^#/, ""));
  if(h.indexOf("examen-") === 0){ ouvrirExamen(h.slice(7)); return; }
  if(h && CONTENU[h]) renderLecon(h); else render();
}
examLoad();
addEventListener("hashchange", route);
route();
